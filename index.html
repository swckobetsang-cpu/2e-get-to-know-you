<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>2E｜認識你多一點</title>
  <style>
    :root{color-scheme:light;--blue:#2557d6;--ink:#14213d;--soft:#eef4ff;--gold:#ffbf3f}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 20%,#fff3c8,transparent 30%),linear-gradient(145deg,#eaf2ff,#f8fbff)}
    main{width:min(900px,100%);padding:42px 28px;text-align:center;background:#fff;border:1px solid #dbe5f7;border-radius:28px;box-shadow:0 20px 55px #254c8d24}
    .badge{display:inline-grid;place-items:center;width:78px;height:78px;border-radius:24px;background:var(--blue);color:#fff;font-size:32px;font-weight:900;transform:rotate(-3deg);box-shadow:8px 8px 0 var(--gold)}
    h1{font-size:clamp(30px,7vw,52px);margin:28px 0 8px}p{font-size:18px;line-height:1.7;margin:8px 0;color:#53627c}.quote{margin:24px auto;padding:15px 20px;border-radius:16px;background:var(--soft);color:var(--blue);font-weight:800}
    iframe{width:100%;height:1500px;margin-top:16px;border:0;border-radius:18px;background:#f7f9fd}small{display:block;margin-top:22px;color:#7b879b}
    @media(max-width:600px){body{padding:0;background:#fff}main{padding:24px 0;border:0;border-radius:0;box-shadow:none}.intro{padding:0 20px}iframe{height:1700px;border-radius:0}}
  </style>
</head>
<body>
  <main>
    <div class="intro">
      <div class="badge">2E</div>
      <h1>認識你多一點</h1>
      <p>Kobe Sir及胡老師想更了解每一位2E同學。<br>請準備學號及正式中文姓名，提交前再次核對。</p>
      <div class="quote">多一點努力，多一點成功</div>
    </div>
    <iframe title="2E認識你多一點學生問卷" src="https://docs.google.com/forms/d/e/1FAIpQLSft_cI2g8rCaC1jvhZOb9sOJDwUdwcnqjrBiRv8XjWBHxydyQ/viewform?embedded=true">載入中…</iframe>
    <small>宣道會陳朱素華紀念中學 · 2026–2027年度</small>
  </main>
</body>
</html>
